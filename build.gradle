plugins { id 'net.minecraftforge.gradle' version '6.+'; id 'java' }
version = '1.0.13-rlcraft'
group = 'com.kettle.fbt'
base.archivesName.set('fbt')
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs { server { workingDirectory project.file('run'); args '--nogui' } }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
jar {
    manifest { attributes(['Specification-Title': 'fbt', 'Specification-Vendor': 'Kettle', 'Specification-Version': '1',
        'Implementation-Title': 'FBT', 'Implementation-Version': project.version, 'Implementation-Vendor': 'Kettle']) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
